name: "MISO Autonomous CI/CD"

on:
  push:
    branches:
      - main # Or whatever your main branch is

jobs:
  test-and-trigger-miso:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Checkout Code
      uses: actions/checkout@v4

    - name: 2. Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 3. Install Dependencies
      # NEW: This is a robust, single-line command
      run: python -m venv venv && source venv/bin/activate && pip install -r requirements.txt

    - name: 4. Run Pytest (and save log)
      # This is the fix: We use a robust, single-line command
      # and 'continue-on-error' to ensure we proceed to Step 5.
      continue-on-error: true
      run: source venv/bin/activate && pytest > pytest_log.txt

    - name: 5. Trigger MISO on Failure
      if: failure()
      run: |
        echo "--- PYTEST FAILED. Triggering MISO ---"
        
        LOG_CONTENT=$(cat pytest_log.txt | python3 -c 'import json, sys; print(json.dumps(sys.stdin.read()))')
        JSON_PAYLOAD="{\"target_file\": \"broken_math.py\", \"error_log\": ${LOG_CONTENT}}"
        
        echo "Sending payload to MISO server at ${{ secrets.MISO_SERVER_IP }}..."
        
        # Send the secure webhook
        curl -X POST "http://${{ secrets.MISO_SERVER_IP }}:5000/miso/trigger" \
             -H "Content-Type: application/json" \
             -H "Authorization: Bearer ${{ secrets.MISO_WEBHOOK_SECRET }}" \
             -d "${JSON_PAYLOAD}"
