name: "MISO CI: Pytest Failure Trigger"

on:
  push:
    branches:
      - main # Or your primary branch

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      pytest_outcome: ${{ steps.pytest.outcome }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Pytest and Capture Log
        id: pytest
        # Run pytest, but tee its output to stdout (for the GHA log)
        # and also to a file (pytest_errors.log) for MISO.
        # We use '|| true' to ensure the step doesn't stop the job.
        run: |
          pytest 2>&1 | tee pytest_errors.log || true

      # This step makes the log file available to the next job
      - name: Upload pytest log artifact
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log
          path: pytest_errors.log

  trigger-miso:
    needs: test
    if: needs.test.outputs.pytest_outcome == 'failure'
    runs-on: ubuntu-latest

    steps:
      # We need the log file from the 'test' job
      - name: Download pytest log artifact
        uses: actions/download-artifact@v4
        with:
          name: pytest-log

      # Install jq to build the JSON payload safely
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: "CRITICAL FAILURE: Triggering MISO Fixer"
        run: |
          ALB_DNS_NAME="miso-alb-345728313.us-east-1.elb.amazonaws.com"
          
          # Read the error log into a variable
          ERROR_LOG=$(cat pytest_errors.log)

          # Use jq to build a valid JSON payload
          JSON_PAYLOAD=$(jq -n \
            --arg event "pytest_failure" \
            --arg branch "${{ github.ref_name }}" \
            --arg commit_sha "${{ github.sha }}" \
            --arg error_log "$ERROR_LOG" \
            '{event: $event, branch: $branch, commit_sha: $commit_sha, error_log: $error_log}')

          curl --fail-with-body --connect-timeout 60 --max-time 180 \
            -X POST "http://${ALB_DNS_NAME}/miso/trigger" \
            --header "Content-Type: application/json" \
            --header "Authorization: Bearer ${{ secrets.MISO_WEBHOOK_SECRET }}" \
            --data-raw "$JSON_PAYLOAD"
