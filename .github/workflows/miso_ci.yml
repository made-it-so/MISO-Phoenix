name: "MISO Autonomous CI/CD"

on:
  push:
    branches:
      - main # Or whatever your main branch is

jobs:
  test-and-trigger-miso:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Checkout Code
      uses: actions/checkout@v4

    - name: 2. Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 3. Install Dependencies
      run: |
        python -m venv venv
        source venv/bin/activate
        pip install -r requirements.txt # (We'll need to create this)
        pip install pytest

        - name: 4. Run Pytest (and save log)
          # This is the fix: we remove '|| true' and add 'continue-on-error'
          # This makes the step show a RED X (failure), but allows the workflow
          # to proceed to Step 5 (which is what we want).
          continue-on-error: true
          run: |
            source venv/bin/activate
            pytest > pytest_log.txt

    - name: 5. Trigger MISO on Failure
      # This step ONLY runs if the previous 'pytest' step failed.
      if: failure()
      run: |
        echo "--- PYTEST FAILED. Triggering MISO ---"
        
        # Read the error log and escape it for JSON
        LOG_CONTENT=$(cat pytest_log.txt | python3 -c 'import json, sys; print(json.dumps(sys.stdin.read()))')
        
        # Build the JSON payload
        # This is hard-coded for our G6 test. A production version would find this dynamically.
        JSON_PAYLOAD="{\"target_file\": \"broken_math.py\", \"error_log\": ${LOG_CONTENT}}"
        
        echo "Sending payload to MISO server..."
        
        # Send the secure webhook
        curl -X POST "http://${{ secrets.MISO_SERVER_IP }}:5000/miso/trigger" \
             -H "Content-Type: application/json" \
             -H "Authorization: Bearer ${{ secrets.MISO_WEBHOOK_SECRET }}" \
             -d "${JSON_PAYLOAD}"
