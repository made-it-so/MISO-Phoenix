name: "MISO CI: Pytest Failure Trigger"

on:
  push:
    branches:
      - main # Or your primary branch

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Pytest
        id: pytest
        run: pytest
        continue-on-error: true # Continue even if pytest fails

  trigger-miso:
    # This job runs ONLY IF the 'test' job failed
    needs: test
    if: failure() && needs.test.outputs.outcome == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: "CRITICAL FAILURE: Triggering MISO Fixer"
        run: |
          # Using the correct HTTP endpoint and DNS name
          ALB_DNS_NAME="miso-alb-345728313.us-east-1.elb.amazonaws.com"
          
          curl --fail-with-body --connect-timeout 60 --max-time 180 \
            -X POST "http://${ALB_DNS_NAME}/miso/trigger" \
            --header "Content-Type: application/json" \
            --header "Authorization: Bearer ${{ secrets.MISO_WEBHOOK_SECRET }}" \
            --data-raw '{
              "event": "pytest_failure",
              "branch": "${{ github.ref_name }}",
              "commit_sha": "${{ github.sha }}"
            }'
