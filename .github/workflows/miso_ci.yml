name: "MISO CI: Pytest Failure Trigger"

on:
  push:
    branches:
      - main # Or your primary branch

jobs:
  test:
    runs-on: ubuntu-latest
    # --- THIS IS THE FIX (PART 1) ---
    # We must explicitly define an output for the job
    outputs:
      pytest_outcome: ${{ steps.pytest.outcome }}
    # --- END OF FIX (PART 1) ---

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Pytest
        id: pytest # This ID is read by the 'outputs' block
        run: pytest
        continue-on-error: true # This is correct, it keeps the job alive

  trigger-miso:
    # This job runs *after* test
    needs: test
    
    # --- THIS IS THE FIX (PART 2) ---
    # We check the *output* of the 'test' job, not its 'failure()' status
    if: needs.test.outputs.pytest_outcome == 'failure'
    # --- END OF FIX (PART 2) ---

    runs-on: ubuntu-latest
    steps:
      - name: "CRITICAL FAILURE: Triggering MISO Fixer"
        run: |
          ALB_DNS_NAME="miso-alb-345728313.us-east-1.elb.amazonaws.com"
          
          curl --fail-with-body --connect-timeout 60 --max-time 180 \
            -X POST "http://${ALB_DNS_NAME}/miso/trigger" \
            --header "Content-Type: application/json" \
            --header "Authorization: Bearer ${{ secrets.MISO_WEBHOOK_SECRET }}" \
            --data-raw '{
              "event": "pytest_failure",
              "branch": "${{ github.ref_name }}",
              "commit_sha": "${{ github.sha }}"
            }'
