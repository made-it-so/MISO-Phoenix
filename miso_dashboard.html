<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>MISO PHOENIX | WAR ROOM</title>
    <script src='https://cdn.tailwindcss.com'></script>
    <script crossorigin src='https://unpkg.com/react@18/umd/react.development.js'></script>
    <script crossorigin src='https://unpkg.com/react-dom@18/umd/react-dom.development.js'></script>
    <script src='https://unpkg.com/@babel/standalone/babel.min.js'></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');
        body { font-family: 'JetBrains Mono', monospace; background-color: #050505; color: #e5e5e5; }
        .scanline { width: 100%; height: 100px; z-index: 10; background: linear-gradient(0deg, rgba(0,0,0,0) 0%, rgba(255, 0, 0, 0.1) 50%, rgba(0,0,0,0) 100%); opacity: 0.1; position: absolute; bottom: 100%; animation: scanline 10s linear infinite; pointer-events: none; }
        @keyframes scanline { 0% { bottom: 100%; } 100% { bottom: -100%; } }
    </style>
</head>
<body>
    <div class='scanline'></div>
    <div id='root'></div>
    <script type='text/babel'>
        const { useState, useEffect } = React;
        function App() {
            const [logs, setLogs] = useState([]);
            // Mock Data Stream for Visualization
            useEffect(() => {
                const interval = setInterval(() => {
                    const msgs = ['Optimizing GAN weights...', 'Gladiator round complete.', 'Syntax verified.', 'Gemini API Latency: 45ms'];
                    const modules = ['ARCHITECT', 'GLADIATOR', 'SOVEREIGN'];
                    const newLog = {
                        id: Date.now(),
                        time: new Date().toLocaleTimeString(),
                        module: modules[Math.floor(Math.random() * modules.length)],
                        message: msgs[Math.floor(Math.random() * msgs.length)]
                    };
                    setLogs(prev => [newLog, ...prev].slice(0, 12));
                }, 1500);
                return () => clearInterval(interval);
            }, []);
            return (
                <div className='min-h-screen p-6 grid grid-cols-12 gap-6'>
                    <div className='col-span-3 border-r border-gray-800 pr-6'>
                        <h1 className='text-4xl font-bold text-red-600 mb-2 tracking-tighter'>MISO<span className='text-white'>PHOENIX</span></h1>
                        <div className='text-xs text-green-500 font-bold mb-8 tracking-widest'>● SYSTEM ONLINE // V66</div>
                        <div className='p-4 bg-gray-900 rounded border border-gray-800 mb-4'>
                            <div className='text-xs text-gray-500 mb-1'>ACTIVE MODULE</div>
                            <div className='text-xl text-blue-400 font-bold'>GLADIATOR</div>
                            <div className='text-xs text-blue-900 mt-1'>Adversarial Mode</div>
                        </div>
                        <div className='p-4 bg-gray-900 rounded border border-gray-800'>
                            <div className='text-xs text-gray-500 mb-1'>BUDGET CAP</div>
                            <div className='text-xl text-white font-bold'>$1.42 / $5.00</div>
                            <div className='w-full bg-gray-800 h-1 mt-2'><div className='bg-green-500 h-1' style={{width: '28%'}}></div></div>
                        </div>
                    </div>
                    <div className='col-span-9 flex flex-col'>
                        <div className='flex-grow bg-black border border-gray-800 p-4 font-mono text-xs mb-4 h-[70vh] overflow-hidden shadow-[0_0_15px_rgba(255,0,0,0.1)]'>
                            {logs.map(log => (
                                <div key={log.id} className='mb-2 border-l-2 border-transparent hover:border-gray-700 pl-2'>
                                    <span className='text-gray-600'>[{log.time}]</span>
                                    <span className='text-blue-500 ml-2 w-24 inline-block'>[{log.module}]</span>
                                    <span className='text-gray-300 ml-2'>{log.message}</span>
                                </div>
                            ))}
                        </div>
                        <div className='flex gap-4'>
                             <input type='text' className='w-full bg-gray-900 border border-gray-700 text-white p-3 font-mono text-sm focus:outline-none focus:border-red-500' placeholder='Enter MISO Command...' />
                             <button className='bg-red-600 hover:bg-red-700 px-8 font-bold text-white text-sm tracking-wider'>EXECUTE</button>
                        </div>
                    </div>
                </div>
            );
        }
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
